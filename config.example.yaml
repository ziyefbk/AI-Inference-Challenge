# ─────────────────────────────────────────────────────────────
# AI-Inference-Challenge 项目配置
# ─────────────────────────────────────────────────────────────

# ── 参赛凭证 ──────────────────────────────────────────────
TEAM_TOKEN: ""          # 参赛 token (必填)
TEAM_NAME: "冤有头债有组" # 队伍名称

# ── 平台 ──────────────────────────────────────────────────
PLATFORM_URL: "http://127.0.0.1:8003"  # 评测平台地址

# ── 模型 ──────────────────────────────────────────────────
MODEL_PATH: "/root/autodl-tmp/models/Qwen2.5-0.5B"  # 模型路径 (必填)，vLLM API 的 model 字段也使用此值

# ── 服务端口 ───────────────────────────────────────────────
CONTESTANT_PORT: 9000    # HTTP 健康检查端口
VLLM_PORT: 8000          # vLLM 推理端口起始

# ── 并发与重试 ────────────────────────────────────────────
MAX_CONCURRENT_MESSAGES: 20    # 最大并发消息数
VLLM_MAX_RETRIES: 3           # vLLM 请求最大重试次数
VLLM_BACKOFF_FACTOR: 1.5       # 退避因子
VLLM_MAX_BACKOFF: 30.0        # 最大退避时间(秒)
VLLM_TIMEOUT: 120.0           # 请求超时(秒)
VLLM_MAX_KEEPALIVE: 100       # keepalive 连接数
VLLM_MAX_CONNECTIONS: 200     # 最大连接数

# ── 熔断器 ────────────────────────────────────────────────
CIRCUIT_BREAKER:
  query:
    failure_threshold: 5
    timeout: 3.0
  ask:
    failure_threshold: 10
    timeout: 5.0
  submit:
    failure_threshold: 50
    timeout: 1.0

# ── 任务持有 ──────────────────────────────────────────────
MAX_HELD_TASKS: 64       # 最大并发持有任务数
TASK_ACCEPT_TIMEOUT: 300  # 任务领取超时(秒)

# ── 预热 ──────────────────────────────────────────────────
WARMUP_ENABLED: true
WARMUP_REQUESTS: 5

# ── 推理参数 ──────────────────────────────────────────────
sampling_params:
  Deterministic:
    temperature: 0.0
    top_p: 1.0
    top_k: 1
    repetition_penalty: 1.0
  Normal:
    temperature: 0.1
    top_p: 0.9
    top_k: 50
    repetition_penalty: 1.1
    frequency_penalty: 0.2
  HighEntropy:
    temperature: 0.3
    top_p: 0.95
    top_k: 100
    repetition_penalty: 1.2
  ExtremePenalty:
    temperature: 0.1
    top_p: 0.9
    top_k: 50
    repetition_penalty: 1.5

sla_levels:
  express:
    ttft_avg: 0.5
    description: "极速选择题"
  fast:
    ttft_avg: 2.0
    description: "短答案"
  standard:
    ttft_avg: 5.0
    description: "常规推理"
  high_quality:
    ttft_avg: 15.0
    description: "复杂推理"

sla_downgrade_thresholds:
  high_quality: 1.2
  standard: 1.3
  fast: 1.5
  express: 1.8

# ── 日志 ──────────────────────────────────────────────────
LOG_LEVEL: "INFO"

# ── 投机解码 ──────────────────────────────────────────────
SPECULATIVE_MODEL: ""    # 留空则不启用
SPECULATIVE_DRAFT_TOKENS: 4
