# ─────────────────────────────────────────────────────────────
# AI-Inference-Challenge 项目配置
# ─────────────────────────────────────────────────────────────

# ── 参赛凭证 ──────────────────────────────────────────────
TEAM_TOKEN: "6ac07c35427ca35e69222b18b51e81b2"          # 参赛 token (必填)
TEAM_NAME: "冤有头债有组"                                 # 队伍名称

# ── 平台 ──────────────────────────────────────────────────
PLATFORM_URL: ""                                        # 评测平台地址 (必填: 需在 .env 或环境变量中设置)

# ── 比赛配置路径 ──────────────────────────────────────────
CONFIG_PATH: ""                       # 比赛配置文件路径 (可通过环境变量覆盖)

# ── 模型 ──────────────────────────────────────────────────
MODEL_PATH: ""                                         # 模型权重目录 (必填)

# ── 服务端口 ───────────────────────────────────────────────
CONTESTANT_PORT: ""                                     # HTTP 健康检查端口 (必填, 如 9000)
VLLM_PORT: 8000                                         # vLLM 推理端口起始

# ── 并发与重试 ────────────────────────────────────────────
MAX_CONCURRENT_MESSAGES: 20                             # 最大并发消息数
VLLM_MAX_RETRIES: 3                                    # vLLM 请求最大重试次数
VLLM_BACKOFF_FACTOR: 1.5                                # 退避因子
VLLM_MAX_BACKOFF: 30.0                                  # 最大退避时间(秒)
VLLM_TIMEOUT: 120.0                                     # 请求超时(秒)
VLLM_MAX_KEEPALIVE: 100                                 # keepalive 连接数
VLLM_MAX_CONNECTIONS: 200                               # 最大连接数

# ── 熔断器 ────────────────────────────────────────────────
CIRCUIT_BREAKER:
  query:
    failure_threshold: 5
    timeout: 3.0
  ask:
    failure_threshold: 10
    timeout: 5.0
  submit:
    failure_threshold: 50
    timeout: 1.0

# ── 任务持有 ──────────────────────────────────────────────
MAX_HELD_TASKS: 64                                      # 最大并发持有任务数
TASK_ACCEPT_TIMEOUT: 300                                # 任务领取超时(秒)

# ── 预热 ──────────────────────────────────────────────────
WARMUP_ENABLED: true
WARMUP_REQUESTS: 5

# ── 推理参数 ──────────────────────────────────────────────
# 字段名与 defination_base.json 完全对齐: penalty_repetition / penalty_frequency / penalty_presence
sampling_params:
  Deterministic:
    temperature: 0.0
    top_p: 1.0
    top_k: 1
    penalty_repetition: 1.0
    penalty_frequency: 0.0
    penalty_presence: 0.0
  Normal:
    temperature: 0.1
    top_p: 0.9
    top_k: 50
    penalty_repetition: 1.1
    penalty_frequency: 0.2
    penalty_presence: 0.2
  HighEntropy:
    temperature: 0.1
    top_p: 0.95
    top_k: 100
    penalty_repetition: 1.05
    penalty_frequency: 0.0
    penalty_presence: 0.0
  ExtremePenalty:
    temperature: 0.1
    top_p: 0.9
    top_k: 20
    penalty_repetition: 1.8
    penalty_frequency: 1.2
    penalty_presence: 1.2

# ── SLA 级别 ───────────────────────────────────────────────
# 与 defination_base.json 的 SLA 字段对齐 (Bronze → Supreme)
# ttft_avg: 该 SLA 级别的目标平均首 token 时间(秒)
# tpot_p50 / tpot_p75: 每 token 延迟百分位数(秒)
sla_levels:
  Bronze:
    ttft_avg: 10
    tpot_p50: 1
    tpot_p75: 2
  Silver:
    ttft_avg: 8
    tpot_p50: 0.8
    tpot_p75: 1.6
  Gold:
    ttft_avg: 6
    tpot_p50: 0.4
    tpot_p75: 0.8
  Platinum:
    ttft_avg: 4
    tpot_p50: 0.2
    tpot_p75: 0.4
  Diamond:
    ttft_avg: 2
    tpot_p50: 0.1
    tpot_p75: 0.2
  Stellar:
    ttft_avg: 1.5
    tpot_p50: 0.08
    tpot_p75: 0.16
  Glorious:
    ttft_avg: 0.8
    tpot_p50: 0.04
    tpot_p75: 0.04
  Supreme:
    ttft_avg: 0.5
    tpot_p50: 0.02
    tpot_p75: 0.01

# ── SLA 降级阈值 ─────────────────────────────────────────
# deadline / estimated_duration 比值低于此阈值时触发 SLA 降级
sla_downgrade_thresholds:
  Bronze: 3.0
  Silver: 2.6
  Gold: 1.8
  Platinum: 1.4
  Diamond: 1.2
  Stellar: 1.16
  Glorious: 1.08
  Supreme: 1.04
  high_quality: 1.2
  standard: 1.3
  fast: 1.5
  express: 1.8

# ── 任务长度分桶 ─────────────────────────────────────────
# 与 defination_base.json 的 LenSpec 对齐
len_spec:
  Small: [0, 128]
  Medium: [128, 256]
  Large: [256, 512]
  XL: [512, 1024]

# ── 日志 ──────────────────────────────────────────────────
LOG_LEVEL: "INFO"

# ── 投机解码 ──────────────────────────────────────────────
SPECULATIVE_MODEL: ""                                    # 留空则不启用
SPECULATIVE_DRAFT_TOKENS: 4
